server {
    listen 80;
    listen 443 ssl http2;
    server_name tools.你的域名.com;

    root /var/www/yl-tools;
    index index.html;

    # SSL 证书路径（用 Let's Encrypt 或平台自动签发）
    # ssl_certificate /etc/letsencrypt/live/tools.你的域名.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tools.你的域名.com/privkey.pem;

    # Gzip 压缩，rules.js 4.7MB 压缩后约 1.3MB
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # 缓存策略
    location ~* \.(js|css)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(html|svg)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # SPA fallback（可选）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
